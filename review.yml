actions:
  apisYmlUpdated: true
  reason: >-
    No public OpenAPI or FHIR CapabilityStatement exists to harvest. apis.yml
    catalogs company identity plus one honest, gated apps.health FHIR EMR
    integration entry. Bootstrap result: built-stub (identity + documented but
    gated FHIR integration, no self-serve public API).
