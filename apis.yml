name: WELL Health Technologies
kind: company
description: >-
  WELL Health Technologies Corp (TSX: WELL, OTCQX: WHTCF) is a Vancouver,
  Canada-headquartered healthcare technology company that is Canada's largest
  outpatient medical clinic owner-operator and a leading multi-disciplinary
  digital health service provider. It runs two synergistic channels: an
  omni-channel patient services business operating 115+ multidisciplinary
  clinics across Canada plus US telehealth and anesthesia operations, and a
  virtual-services / practitioner-enablement platform serving 44,000+ providers
  through the OSCAR Pro EMR, billing and revenue-cycle tools, eReferral, digital
  booking, and ePharma. Its programmatic surface is the apps.health marketplace,
  through which third-party digital health apps integrate with WELL's network of
  EMRs (OSCAR Pro, Profile) using HL7 FHIR and other interoperability standards.
  As of this review WELL exposes no self-serve public developer portal, sandbox,
  OpenAPI, or FHIR CapabilityStatement; integration is FHIR-based but gated
  behind a partner/contact process. Home market is Canada, positioned in a
  province-fragmented healthcare landscape coordinated federally by Canada Health
  Infoway's pan-Canadian FHIR (CA Core / CA Baseline) specifications.
