apis:
- aid: well-health:apps-health-integration
  name: apps.health EMR Integration (FHIR)
  description: >-
    apps.health is WELL Health's digital health marketplace through which
    third-party apps and services integrate with WELL's network of EMRs (OSCAR
    Pro, Profile), which support HL7 FHIR and other interoperability standards.
    Integration is offered to vetted partners: developers submit their solution
    via a developer contact form and WELL supports the integration to its EMR
    network reaching 2,000+ clinics and 10,000+ healthcare professionals across
    Canada. No self-serve public API documentation, base URL, sandbox, or FHIR
    CapabilityStatement is published; the FHIR integration surface is gated
    behind a partner/contact process.
